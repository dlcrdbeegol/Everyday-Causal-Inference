[project]
name = "everyday-causal-inference"
version = "0.1.0"
description = "Ambiente de estudo para os exercícios e capítulos de Everyday Causal Inference"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "diff-diff>=0.1",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "notebook>=7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
